name: CI

on:
    push:
        branches: [develop, "release/*"]
    pull_request:
        branches: [develop, "release/*"]
    schedule:
        - cron: "0 0 * * *"

    workflow_dispatch:

# The test report action publishes its results as a check run.
permissions:
    contents: read
    checks: write

jobs:
    determine-gate:
        name: Determine Quality Gate
        runs-on: ubuntu-24.04
        outputs:
            marker: ${{ steps.gate.outputs.marker }}
        steps:
            - name: Determine Quality Gate
              id: gate
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "schedule" ]; then
                      marker="gate_develop_nightly"
                  elif [ "${{ github.event_name }}" = "pull_request" ]; then
                      if [[ "${{ github.base_ref }}" == release/* ]]; then
                          marker="gate_release_pr"
                      else
                          marker="gate_develop_pr"
                      fi
                  elif [ "${{ github.event_name }}" = "push" ]; then
                      if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
                          marker="gate_release"
                      else
                          marker="gate_develop_push"
                      fi
                  else
                      marker="gate_develop_push"
                  fi
                  echo "Selected gate marker: $marker"
                  echo "marker=$marker" >> "$GITHUB_OUTPUT"

    test-on-linux:
        name: Build and Test on Linux
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: determine-gate

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Provision via bootstrap scripts
              run: |
                  sudo ./bootstrap_ubuntu.sh
                  ./bootstrap_python.sh
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Installation of Dependencies and Execute Tests
              run: |
                  ./build.sh --install
                  ./build.sh --selftests --marker "${{ needs.determine-gate.outputs.marker }}"

            - name: Deploy Test Results
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: |
                      test/output/test-report.xml
                      build/**/variant-junit.xml
                  detailed_summary: true
                  include_passed: true
                  fail_on_failure: true
                  fail_on_parse_error: true
                  require_tests: true
                  check_name: "Test Results (Linux)"

            - name: Deploy Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts_linux
                  retention-days: 90
                  path: |
                      build/**/*.7z
                      build/**/pr_changes.json
                  if-no-files-found: error
